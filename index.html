<!doctype html>
<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>AR — Выборгская</title>

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

    }


    #cameraVideo {

      position: fixed;

      z-index: 0;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      pointer-events: none;

    }


    a-scene {

      position: fixed !important;

      z-index: 1;

      top: 0;
      left: 0;

      width: 100vw !important;
      height: 100vh !important;

    }


    #status {

      position: fixed;

      z-index: 1000;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      padding: 10px 16px;

      border-radius: 20px;

      background: rgba(0,0,0,.65);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

      white-space: nowrap;

    }

  </style>

</head>


<body>


<video
  id="cameraVideo"
  autoplay
  muted
  playsinline>
</video>


<div id="status">

  Запуск камеры...

</div>


<a-scene

  embedded

  renderer="
    alpha: true;
    colorManagement: true;
    antialias: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  mindar-image="

    imageTargetSrc: ./targets.mind;

    maxTrack: 1;

    filterMinCF: 0.0001;

    filterBeta: 0.0005;

    warmupTolerance: 15;

    missTolerance: 30;

    autoStart: true;

    uiLoading: yes;

    uiScanning: yes;

    uiError: yes;

  "

>


  <a-assets>

    <a-asset-item

      id="vyborgAsset"

      src="./assets/выборгская.glb">

    </a-asset-item>

  </a-assets>


  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>


  <!-- ================================= -->
  <!-- ВЫБОРГСКАЯ -->
  <!-- targetIndex 0 -->
  <!-- ================================= -->


  <a-entity

    id="targetVyborg"

    mindar-image-target="targetIndex: 0">


    <a-gltf-model

      id="modelVyborg"

      src="#vyborgAsset"

      visible="false"

      position="0 0 0"

      scale="0.04 0.04 0.04"

      rotation="90 0 0">

    </a-gltf-model>


  </a-entity>


</a-scene>


<script>


const video =
  document.querySelector("#cameraVideo");


const target =
  document.querySelector("#targetVyborg");


const model =
  document.querySelector("#modelVyborg");


const status =
  document.querySelector("#status");


/* ----------------------------- */
/* Камера */
/* ----------------------------- */

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          }

        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();


    status.textContent =
      "Наведите камеру на маркер";


  } catch (error) {

    console.error(error);

    status.textContent =
      "Нет доступа к камере";

  }

}


/* ----------------------------- */
/* Маркер найден */
/* ----------------------------- */

target.addEventListener(

  "targetFound",

  () => {

    model.setAttribute(
      "visible",
      true
    );

    status.textContent =
      "ВЫБОРГСКАЯ";

  }

);


/* ----------------------------- */
/* Маркер потерян */
/* ----------------------------- */

target.addEventListener(

  "targetLost",

  () => {

    model.setAttribute(
      "visible",
      false
    );

    status.textContent =
      "Наведите камеру на маркер";

  }

);


startCamera();


</script>


</body>

</html>
