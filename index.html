<!doctype html>
<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>AR — Выборгская</title>


  <!-- MindAR -->

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>


  <!-- A-Frame -->

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>


  <!-- MindAR + A-Frame -->

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      touch-action: none;

    }


    #cameraVideo {

      position: fixed;

      z-index: 0;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      pointer-events: none;

    }


    a-scene {

      position: fixed !important;

      z-index: 1;

      top: 0;
      left: 0;

      width: 100vw !important;
      height: 100vh !important;

    }


    #status {

      position: fixed;

      z-index: 1000;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      padding: 10px 16px;

      border-radius: 20px;

      background: rgba(0,0,0,.65);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

      white-space: nowrap;

      pointer-events: none;

    }


    #help {

      position: fixed;

      z-index: 1000;

      bottom: 18px;
      left: 50%;

      transform: translateX(-50%);

      padding: 9px 14px;

      border-radius: 18px;

      background: rgba(0,0,0,.55);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 12px;

      text-align: center;

      pointer-events: none;

    }

  </style>

</head>


<body>


<!-- Камера -->

<video
  id="cameraVideo"
  autoplay
  muted
  playsinline>
</video>


<!-- Статус -->

<div id="status">

  Запуск камеры...

</div>


<!-- Подсказка -->

<div id="help">

  1 палец — перемещение · 2 пальца — масштаб · двойной тап — сброс

</div>


<a-scene

  embedded

  renderer="
    alpha: true;
    colorManagement: true;
    antialias: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  mindar-image="

    imageTargetSrc: ./targets.mind;

    maxTrack: 1;

    filterMinCF: 0.0001;

    filterBeta: 0.0005;

    warmupTolerance: 15;

    missTolerance: 30;

    autoStart: true;

    uiLoading: yes;

    uiScanning: yes;

    uiError: yes;

  "

>


  <a-assets>

    <a-asset-item

      id="vyborgAsset"

      src="./assets/выборгская.glb">

    </a-asset-item>

  </a-assets>


  <!-- Камера A-Frame -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>


  <!-- ================================= -->
  <!-- ВЫБОРГСКАЯ -->
  <!-- targetIndex 0 -->
  <!-- ================================= -->


  <a-entity

    id="targetVyborg"

    mindar-image-target="targetIndex: 0">


    <a-gltf-model

      id="modelVyborg"

      src="#vyborgAsset"

      visible="false"

      position="0 0 0"

      scale="0.04 0.04 0.04"

      rotation="90 0 0">

    </a-gltf-model>


  </a-entity>


</a-scene>


<script>


/* ========================================= */
/* ОСНОВНЫЕ ЭЛЕМЕНТЫ */
/* ========================================= */


const video =
  document.querySelector("#cameraVideo");


const target =
  document.querySelector("#targetVyborg");


const model =
  document.querySelector("#modelVyborg");


const status =
  document.querySelector("#status");


const scene =
  document.querySelector("a-scene");


/* ========================================= */
/* НАСТРОЙКИ */
/* ========================================= */


const INITIAL_SCALE = 0.04;


/*

   Минимальный и максимальный масштаб.

*/

const MIN_SCALE = 0.005;

const MAX_SCALE = 0.20;


/*

   Чувствительность перемещения.

*/

const MOVE_SENSITIVITY = 0.003;


/* ========================================= */
/* ТЕКУЩЕЕ СОСТОЯНИЕ */
/* ========================================= */


let currentScale =
  INITIAL_SCALE;


let currentX = 0;

let currentY = 0;

let currentZ = 0;


let targetFound =
  false;


/* ========================================= */
/* КАМЕРА */
/* ========================================= */


async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      "Наведите камеру на маркер";


  }

  catch (error) {

    console.error(error);


    status.textContent =
      "Нет доступа к камере";

  }

}


/* ========================================= */
/* ПРИМЕНЕНИЕ TRANSFORM */
/* ========================================= */


function applyTransform() {


  model.setAttribute(

    "position",

    `${currentX} ${currentY} ${currentZ}`

  );


  model.setAttribute(

    "scale",

    `${currentScale} ${currentScale} ${currentScale}`

  );


  status.textContent =
    "ВЫБОРГСКАЯ · масштаб " +
    currentScale.toFixed(3);

}


/* ========================================= */
/* ПОКАЗ / СКРЫТИЕ МОДЕЛИ */
/* ========================================= */


target.addEventListener(

  "targetFound",

  () => {

    targetFound =
      true;


    model.setAttribute(
      "visible",
      true
    );


    applyTransform();

  }

);


target.addEventListener(

  "targetLost",

  () => {

    targetFound =
      false;


    model.setAttribute(
      "visible",
      false
    );


    status.textContent =
      "Наведите камеру на маркер";

  }

);


/* ========================================= */
/* TOUCH */
/* ========================================= */


let touchStartX =
  0;

let touchStartY =
  0;


let lastTouchX =
  0;

let lastTouchY =
  0;


let initialPinchDistance =
  0;


let initialPinchScale =
  INITIAL_SCALE;


let touchMode =
  null;


/* ========================================= */
/* РАССТОЯНИЕ МЕЖДУ ДВУМЯ ПАЛЬЦАМИ */
/* ========================================= */


function getDistance(touch1, touch2) {

  const dx =
    touch1.clientX -
    touch2.clientX;


  const dy =
    touch1.clientY -
    touch2.clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* ========================================= */
/* TOUCH START */
/* ========================================= */


document.addEventListener(

  "touchstart",

  function(event) {


    if (!targetFound)
      return;


    /* Два пальца */

    if (event.touches.length === 2) {


      touchMode =
        "pinch";


      initialPinchDistance =
        getDistance(

          event.touches[0],

          event.touches[1]

        );


      initialPinchScale =
        currentScale;


      event.preventDefault();


      return;

    }


    /* Один палец */

    if (event.touches.length === 1) {


      touchMode =
        "move";


      touchStartX =
        event.touches[0].clientX;


      touchStartY =
        event.touches[0].clientY;


      lastTouchX =
        touchStartX;


      lastTouchY =
        touchStartY;


      event.preventDefault();

    }

  },

  { passive: false }

);


/* ========================================= */
/* TOUCH MOVE */
/* ========================================= */


document.addEventListener(

  "touchmove",

  function(event) {


    if (!targetFound)
      return;


    /* ===================== */
    /* PINCH */
    /* ===================== */


    if (

      event.touches.length === 2 &&

      touchMode === "pinch"

    ) {


      const distance =
        getDistance(

          event.touches[0],

          event.touches[1]

        );


      if (
        initialPinchDistance > 0
      ) {


        const ratio =
          distance /
          initialPinchDistance;


        let newScale =
          initialPinchScale *
          ratio;


        newScale =
          Math.max(

            MIN_SCALE,

            Math.min(

              MAX_SCALE,

              newScale

            )

          );


        currentScale =
          newScale;


        applyTransform();

      }


      event.preventDefault();


      return;

    }


    /* ===================== */
    /* ПЕРЕМЕЩЕНИЕ */
    /* ===================== */


    if (

      event.touches.length === 1 &&

      touchMode === "move"

    ) {


      const x =
        event.touches[0].clientX;


      const y =
        event.touches[0].clientY;


      const dx =
        x - lastTouchX;


      const dy =
        y - lastTouchY;


      /*

        Двигаем модель
        по плоскости XY.

      */


      currentX +=
        dx *
        MOVE_SENSITIVITY;


      currentY -=
        dy *
        MOVE_SENSITIVITY;


      lastTouchX =
        x;


      lastTouchY =
        y;


      applyTransform();


      event.preventDefault();

    }

  },

  { passive: false }

);


/* ========================================= */
/* TOUCH END */
/* ========================================= */


document.addEventListener(

  "touchend",

  function(event) {


    if (
      event.touches.length === 0
    ) {

      touchMode =
        null;

    }

  },

  { passive: false }

);


/* ========================================= */
/* ДВОЙНОЙ ТАП — СБРОС */
/* ========================================= */


let lastTap =
  0;


document.addEventListener(

  "touchend",

  function() {


    const now =
      Date.now();


    if (
      now - lastTap < 300
    ) {


      currentScale =
        INITIAL_SCALE;


      currentX =
        0;


      currentY =
        0;


      currentZ =
        0;


      applyTransform();

    }


    lastTap =
      now;

  }

);


/* ========================================= */
/* ЗАПУСК */
/* ========================================= */


startCamera();


</script>


</body>

</html>
