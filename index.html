<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>AR — Выборгская</title>

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .status {
      position: fixed;
      z-index: 20;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      padding: 7px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 13px;
      pointer-events: none;
    }

    .hint {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 20px;
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="status" id="status">
  Наведите камеру на метку ВЫБОРГСКАЯ
</div>

<div class="hint">
  Наведите камеру на метку
</div>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    maxTrack: 1;
    filterMinCF: 0.0003;
    filterBeta: 0.002;
    warmupTolerance: 8;
    missTolerance: 15;
    autoStart: true;
    uiLoading: yes;
    uiScanning: yes;
    uiError: yes;
  "
  color-space="sRGB"
  renderer="
    colorManagement: true;
    physicallyCorrectLights;
    antialias: true;
  "
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="vyborgAsset"
      src="./assets/выборгская.glb">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- ВЫБОРГСКАЯ = targetIndex 1 -->

  <a-entity
    id="targetVyborg"
    mindar-image-target="targetIndex: 1">

    <a-gltf-model
      id="modelVyborg"
      src="#vyborgAsset"
      visible="false"
      position="0 0 0"
      scale="0.04 0.04 0.04"
      rotation="0 180 0">
    </a-gltf-model>

  </a-entity>

</a-scene>

<script>

const target = document.querySelector("#targetVyborg");
const model = document.querySelector("#modelVyborg");
const status = document.querySelector("#status");

target.addEventListener("targetFound", () => {

  model.setAttribute("visible", true);

  status.textContent = "ВЫБОРГСКАЯ";

});

target.addEventListener("targetLost", () => {

  model.setAttribute("visible", false);

  status.textContent =
    "Наведите камеру на метку ВЫБОРГСКАЯ";

});

</script>

</body>
</html>
