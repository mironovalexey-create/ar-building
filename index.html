<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>AR Test — Выборгская</title>

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      z-index: 100;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 20px;
      background: rgba(0,0,0,.7);
      color: white;
      font-size: 14px;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div id="status">
  Наведите камеру на маркер
</div>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    maxTrack: 1;
    filterMinCF: 0.0003;
    filterBeta: 0.002;
    warmupTolerance: 8;
    missTolerance: 15;
    autoStart: true;
    uiLoading: yes;
    uiScanning: yes;
    uiError: yes;
  "
  color-space="sRGB"
  renderer="
    colorManagement: true;
    physicallyCorrectLights;
    antialias: true;
  "
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- НОВЫЙ МАРКЕР ВЫБОРГСКОЙ -->
  <!-- targetIndex 0 -->

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <!-- ТЕСТОВЫЙ ОБЪЕКТ -->
    <a-box
      id="testBox"
      position="0 0 0.2"
      rotation="0 0 0"
      scale="0.4 0.4 0.4"
      visible="false">
    </a-box>

  </a-entity>

</a-scene>

<script>

const target = document.querySelector("#target");
const box = document.querySelector("#testBox");
const status = document.querySelector("#status");

target.addEventListener("targetFound", () => {

  box.setAttribute("visible", true);

  status.textContent = "✓ МАРКЕР ВЫБОРГСКОЙ РАСПОЗНАН";

});

target.addEventListener("targetLost", () => {

  box.setAttribute("visible", false);

  status.textContent = "Наведите камеру на маркер";

});

</script>

</body>
</html>
