<div id="pager"><button id="pPrev">←</button><div id="pageName">1 этаж</div><div id="counter">01 / 02</div><button id="pNext">→</button></div>
<div id="hint">колесо — zoom · drag — pan · свайп — этаж</div>
</div>
</div>
<script>
const stage=document.getElementById('stage');
const canvas=document.getElementById('canvas');
const pages=[...document.querySelectorAll('.page')];
const names=['1 этаж','6 этаж'];
let page=0,scale=1,tx=0,ty=0;
let dragging=false,lastX=0,lastY=0,startX=0,startY=0;

function svgOf(i){return pages[i].querySelector('svg');}
function sizePage(i){
 const svg=svgOf(i),vb=svg.viewBox.baseVal,w=Math.max(1,vb.width),h=Math.max(1,vb.height);
 pages[i].style.width=w+'px'; pages[i].style.height=h+'px';
 svg.setAttribute('width',w); svg.setAttribute('height',h);
 svg.style.width=w+'px'; svg.style.height=h+'px';
}
pages.forEach((_,i)=>sizePage(i));

function setTransform(){canvas.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';}
function fit(){
 const vb=svgOf(page).viewBox.baseVal,sw=stage.clientWidth,sh=stage.clientHeight,pad=55;
 scale=Math.min((sw-pad*2)/vb.width,(sh-pad*2)/vb.height);
 scale=Math.max(.001,Math.min(scale,10));
 tx=(sw-vb.width*scale)/2;ty=(sh-vb.height*scale)/2;setTransform();
}
function zoomAt(f,cx,cy){
 const oldScale=scale;
 const ns=Math.max(0.0001,Math.min(oldScale*f,50));
 if (Math.abs(ns-oldScale) < 0.000001) return;
 const k=ns/oldScale;
 tx=cx-(cx-tx)*k;
 ty=cy-(cy-ty)*k;
 scale=ns;
 setTransform();
}
function zoomIn(){
 zoomAt(1.25,stage.clientWidth/2,stage.clientHeight/2);
}
function zoomOut(){
 zoomAt(0.8,stage.clientWidth/2,stage.clientHeight/2);
}
function showPage(n){
 page=(n+pages.length)%pages.length;
 pages.forEach((p,i)=>p.classList.toggle('active',i===page));
 document.getElementById('pageName').textContent=names[page];
 document.getElementById('counter').textContent='0'+(page+1)+' / 02';
 fit();
}
document.getElementById('prev').onclick=()=>showPage(page-1);
document.getElementById('next').onclick=()=>showPage(page+1);
document.getElementById('pPrev').addEventListener('click',e=>{e.stopPropagation();showPage(page-1);});
document.getElementById('pNext').addEventListener('click',e=>{e.stopPropagation();showPage(page+1);});
document.getElementById('fit').onclick=fit;
document.getElementById('minus').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();zoomOut();});
document.getElementById('plus').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();zoomIn();});
document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();

stage.addEventListener('wheel',e=>{
 e.preventDefault();const r=stage.getBoundingClientRect();
 zoomAt(e.deltaY<0?1.18:.847,e.clientX-r.left,e.clientY-r.top);
},{passive:false});

stage.addEventListener('pointerdown',e=>{
 if(e.target.closest('#pager') || e.target.closest('button')) return;
 dragging=true;startX=lastX=e.clientX;startY=lastY=e.clientY;
 stage.classList.add('dragging');stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
 if(!dragging)return;tx+=e.clientX-lastX;ty+=e.clientY-lastY;
 lastX=e.clientX;lastY=e.clientY;setTransform();
});
stage.addEventListener('pointerup',e=>{
 if(!dragging)return;dragging=false;stage.classList.remove('dragging');
 const dx=e.clientX-startX,dy=e.clientY-startY;
 if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.25)showPage(page+(dx<0?1:-1));
});
stage.addEventListener('pointercancel',()=>{dragging=false;stage.classList.remove('dragging');});
stage.addEventListener('dblclick',e=>{
 const r=stage.getBoundingClientRect();zoomAt(1.6,e.clientX-r.left,e.clientY-r.top);
});
window.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')showPage(page+1);
 if(e.key==='ArrowLeft')showPage(page-1);
 if(e.key==='0')fit();
 if(e.key==='+')zoomIn();
 if(e.key==='-')zoomOut();
});
window.addEventListener('resize',fit);
fit();
</script>
